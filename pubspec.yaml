name: rna_guide
description: RNA Guide - Application terrain pour la Régénération Naturelle Assistée
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # ── State Management ──────────────────────────────────────
  get: ^4.6.6                    # GetX: routes + state + DI

  # ── Base de données locale ────────────────────────────────
  sqflite: ^2.3.0                # SQLite offline
  path_provider: ^2.1.1          # chemins système fichiers
  path: ^1.8.3

  # ── Réseau ───────────────────────────────────────────────
  dio: ^5.4.0                    # HTTP client avec interceptors
  connectivity_plus: ^5.0.2      # détection réseau offline

  # ── Auth & Sécurité ───────────────────────────────────────
  flutter_secure_storage: ^9.0.0 # stockage sécurisé tokens
  jwt_decoder: ^2.0.1

  # ── Géolocalisation ───────────────────────────────────────
  geolocator: ^11.0.0            # GPS
  geocoding: ^3.0.0

  # ── Cartographie ──────────────────────────────────────────
  flutter_map: ^6.1.0            # Leaflet-like pour Flutter
  latlong2: ^0.9.1

  # ── Caméra & Photos ───────────────────────────────────────
  camera: ^0.10.5+9
  image_picker: ^1.0.7
  flutter_image_compress: ^2.1.0
  image: ^4.1.7
  exif: ^3.3.0                   # lecture EXIF GPS

  # ── UI ───────────────────────────────────────────────────
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0               # loading skeletons
  fl_chart: ^0.68.0             # graphiques
  flutter_slidable: ^3.0.1      # swipe actions listes
  badges: ^3.1.2
  lottie: ^3.1.0               # animations Lottie
  percent_indicator: ^4.2.3

  # ── Formulaires ───────────────────────────────────────────
  reactive_forms: ^17.0.1

  # ── Internationalisation ──────────────────────────────────
  intl: ^0.20.2
  flutter_localizations:
    sdk: flutter

  # ── Stockage local ────────────────────────────────────────
  shared_preferences: ^2.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # ── Permissions ───────────────────────────────────────────
  permission_handler: ^11.3.0

  # ── Utils ─────────────────────────────────────────────────
  uuid: ^4.3.3
  collection: ^1.18.0
  equatable: ^2.0.5
  dartz: ^0.10.1                # functional error handling
  logger: ^2.0.2+1
  timeago: ^3.6.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
  generate: true

  # assets: (à renseigner quand les fichiers sont ajoutés)

  # fonts: (Inter à ajouter dans assets/fonts/ pour la prod)
